            Prior-findings resolution (round 1 FAIL):
            1. Config-key contradiction: RESOLVED. The packaging decision is made (data_dirs: [templates, static] declared in defaults.yaml), the application-known key set is enumerated, Exodan-owned keys (data_dirs, extra_domains, timers, service, exec_args) are explicitly tolerated without reinterpretation, and other unrecognized top-level keys fail. Both branches of the prior ambiguity are now safe and consistent with PROJECT-INTEGRATION.md.
            2. Edge-case coverage links: RESOLVED. "Incomplete initial write" now cites AC001.3/RT001.3 and adds the implementation-review check for private write, durable initial record and atomic publication.
            3. Undefined "explicit recovery": RESOLVED. Recovery is now defined as operator-side retention of the damaged directory plus backup restoration or a replacement poll, with automatic truncation or repair prohibited; docs/ARCHITECTURE.md was updated consistently.

            No annotation records or blocks in spec.org; no feedback.yaml required; no audit-state duplication; sign-off metadata concise and impersonal. Scope, over-engineering and template inflation re-checked: no new violations; the input limits and recovery definition close previously acknowledged gaps without adding mechanisms.

            FOLLOW-UP WORK (bounded, reversible; does not invalidate sign-off):

            1. Test coverage for the config-key policy. The remediated decision (tolerate Exodan-owned keys, reject unrecognized top-level keys) is observable behaviour under AC001.5 but no RT case exercises it: RT001.5 checks env-supplied paths and help/version only. Add named child cases to the RT001.5 (or RT001.2) case group: a config file containing Exodan-owned keys loads successfully; an unrecognized top-level key fails with a precise error. This is a compound-condition coverage gap under ISSUES.md/TESTING.md, closable by case additions before the test-code gate.

            2. Test coverage for the new input bounds and normalization. "2–200 options, 200-character title, 200-character option names, 2,000-character descriptions; trim surrounding whitespace; reject empty or duplicate normalized names" states observable behaviour not represented in RT001.2's case list (empty title, fewer than two options, exact duplicate names, malformed base_url, unwritable state). Add named cases: an over-limit title or option name is rejected; option names differing only by surrounding whitespace are rejected as duplicates. Bounded case additions, no design change.

            3. Documentary reconciliation in docs/ARCHITECTURE.md. The body now specifies the interrupted-write/close recovery protocol, superseding the prior "remains to be specified before implementation" stance, but the document retains version 4 with the version-2 changelog note that recovery "remains an explicit design question" and no entry recording the resolution. Record the recovery-protocol decision in the document changelog (increment the version or amend the current entry) per DOCUMENTATION.md's accuracy and changelog rules. Bounded editorial correction to a cited authority, suitable for the delivery handoff's existing "reconcile docs/ARCHITECTURE.md" item.

            Items 1 and 2 should land in spec.org before the test-code gate so the implemented RT package matches the signed-off definitions; item 3 may land with delivery documentation.
